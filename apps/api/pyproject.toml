[project]
name = "superapp-api"
version = "0.1.0"
description = "Personal super app — modular monolith API + substrate"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["superapp"]
